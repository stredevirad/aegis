route:
  receiver: aegis
  group_by: [alertname, service_name]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
receivers:
  - name: aegis
    webhook_configs:
      - url: http://api:8000/api/v1/alerts/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/aegis/alert-ingest-key

# Aegis frontend: serves the built SPA and proxies /api/ and /auth/ to the API service.
# Runs as the unprivileged nginx user (port 8080, temp files and pid under /tmp).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No query strings in the access log (filters can contain operator-typed text).
    log_format aegis '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                     '$request_time "$http_x_request_id"';
    access_log /dev/stdout aegis;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Re-resolve the API's name while running: without `resolve`, nginx looks `api` up once at
    # startup and keeps proxying to the old address after the api container is recreated (502).
    # 127.0.0.11 is Docker's embedded DNS (compose networks); `resolve` needs nginx >= 1.27.3.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream aegis_api {
        zone aegis_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (security model C19). No inline scripts or styles are needed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Proxy settings shared by every proxied location (inherited: locations below define none).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # The API sets these too; keep one copy (nginx adds them above).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        # Server-Sent Events: never buffer, allow the stream's 5-minute lifetime.
        location ~ ^/api/v1/investigations/[^/]+/stream$ {
            proxy_pass http://aegis_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 10m;
            gzip off;
        }

        location /api/ {
            proxy_pass http://aegis_api;
        }

        location /auth/ {
            proxy_pass http://aegis_api;
        }

        # Hashed build assets: cache for a long time.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # SPA history fallback; index.html is never cached.
        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}

# Repo frozen at v1.0.x: limit 0 stops version-update PRs. Security updates are configured in
# the repository settings and are not affected by this limit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups:
      frontend: {patterns: ["*"]}

  - package-ecosystem: uv
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups:
      backend: {patterns: ["*"]}

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups:
      images: {patterns: ["*"]}

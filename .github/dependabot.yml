version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      frontend: {patterns: ["*"]}

  - package-ecosystem: uv
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      backend: {patterns: ["*"]}

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      images: {patterns: ["*"]}

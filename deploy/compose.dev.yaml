# Minimal development/test database for the Aegis backend.
#
#   docker compose -f deploy/compose.dev.yaml up -d
#   cd backend && uv run --frozen pytest -m db
#   docker compose -f deploy/compose.dev.yaml --profile auth up -d   # + Dex (OIDC, port 5556)
#
# The superuser is used only by the bootstrap step and the test fixtures; the application
# always connects as the restricted aegis_app role (ADR-012). Development-only credentials.
name: aegis-dev

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: devsuperuser
      POSTGRES_DB: aegis
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    mem_limit: 128m
    profiles: ["auth"]

volumes:
  pgdata:
